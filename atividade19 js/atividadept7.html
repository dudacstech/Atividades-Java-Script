<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 19 pt 7</title>
</head>

<body>
    <script>
        var soma = 0;
        var i = 1;

        while (i <= 6) {
            var nota;

            do {
                nota = parseFloat(prompt("Digite a nota " + i + " (0 a 10):"));

                if (isNaN(nota) | nota < 0 | nota > 10) {
                    alert("Valor inválido! Digite um número entre 0 e 10.");
                }

            } while (isNaN(nota) | nota < 0 | nota > 10);

            soma = soma + nota;
            i++;
        }

        var media = soma / 6;

        alert("Média do aluno: " + media.toFixed(2));
    </script>
</body>

</html>
