<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 19 pt 4</title>
</head>

<body>
    <script>
        function calcularMedia() {
            var soma = 0;
            var contador = 0;
            var numero = 15;

            while (numero <= 100) {
                soma = soma + numero;
                contador = contador + 1;
                numero = numero + 1;
            }

            var media = soma / contador;

            console.log("Soma total: " + soma);
            console.log("Quantidade de números: " + contador);
            console.log("Média aritmética: " + media);
        }

        calcularMedia();
    </script>
</body>

</html>
