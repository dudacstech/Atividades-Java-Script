<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12 calculadora soma de números</title>
</head>

<body>
    <script>

        let soma = 0;


        for (let i = 1; i <= 15; i++) {
            soma = soma + i;
        }

        document.write("<h2>Cálculo de Soma Sequencial</h2>");
        document.write("<p>Calculando a soma de todos os números inteiros de <b>1 a 15</b>...</p>");

        document.write("<hr>");

        document.write("<p>O resultado total da soma é: <span style='font-size: 20px; color: blue;'><b>" + soma + "</b></span></p>");
    </script>
</body>

</html>
