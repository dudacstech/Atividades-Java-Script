<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 número divisível</title>
</head>

<body>
    <h1>Números Divisíveis</h1>
    <script>
        let numero = prompt("Escolha um Número")
        document.write("Seu número é " + numero)

        if (numero % 10 === 0) { alert("É divisível por 10") }

        else if (numero % 5 === 0) { alert("É divisível por 5") }


        else if (numero % 2 === 0) { alert("É divisível por 2") }

        else {
            alert("Não é divisível por nenhum deles")
        }






    </script>

</body>

</html>
