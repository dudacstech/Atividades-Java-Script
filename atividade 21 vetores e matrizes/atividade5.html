<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ex05</title>
  </head>
  <body>
    <script>
      let v = [];

      for (let i = 0; i < 5; i++) {
        v[i] = parseInt(prompt("Digite um número:"));
      }

      let maior = v[0];
      let menor = v[0];

      for (let i = 1; i < 5; i++) {
        if (v[i] > maior) maior = v[i];
        if (v[i] < menor) menor = v[i];
      }

      document.write("Maior: " + maior + "<br>");
      document.write("Menor: " + menor);
    </script>
  </body>
</html>
