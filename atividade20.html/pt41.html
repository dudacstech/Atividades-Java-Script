<!doctype html>
<html>
  <body>
    <script>
      let num = parseInt(prompt("Digite um número:"));
      let soma = 0;

      for (let i = 1; i <= num; i++) {
        if (i % 2 == 0) {
          soma += i;
        }
      }

      document.write("Soma: " + soma);
    </script>
  </body>
</html>
