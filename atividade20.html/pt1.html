<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Loop While</title>
  </head>
  <body>
    <h1>Números de 1 a 10</h1>
    <div id="resultado"></div>

    <script>
      let numero = 1;
      let resultado = document.getElementById("resultado");

      while (numero <= 10) {
        resultado.innerHTML += numero + "<br>";
        numero++;
      }
    </script>
  </body>
</html>
