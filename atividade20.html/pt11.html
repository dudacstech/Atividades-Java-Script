<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Soma dos pares</title>
  </head>
  <body>
    <h1>Soma dos números pares</h1>
    <div id="resultado"></div>

    <script>
      let numero = parseInt(prompt("Digite um número inteiro:"));
      let contador = 1;
      let soma = 0;

      while (contador <= numero) {
        if (contador % 2 === 0) {
          soma += contador;
        }
        contador++;
      }

      document.getElementById("resultado").innerHTML =
        "Soma dos pares entre 1 e " + numero + ": " + soma;
    </script>
  </body>
</html>
