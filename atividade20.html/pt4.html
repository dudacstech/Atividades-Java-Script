<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Média de 5 números</title>
  </head>
  <body>
    <h1>Média de 5 números</h1>
    <div id="resultado"></div>

    <script>
      let contador = 1;
      let soma = 0;

      while (contador <= 5) {
        let numero = parseInt(prompt("Digite o " + contador + "º número:"));
        soma += numero;
        contador++;
      }

      let media = soma / 5;

      document.getElementById("resultado").innerHTML = "Média: " + media;
    </script>
  </body>
</html>
