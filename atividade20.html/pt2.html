<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Soma de 1 a 100</title>
  </head>
  <body>
    <h1>Soma dos números de 1 a 100</h1>
    <div id="resultado"></div>

    <script>
      let numero = 1;
      let soma = 0;

      while (numero <= 100) {
        soma += numero;
        numero++;
      }

      document.getElementById("resultado").innerHTML = "Resultado: " + soma;
    </script>
  </body>
</html>
