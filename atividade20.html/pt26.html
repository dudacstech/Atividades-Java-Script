<!doctype html>
<html>
  <body>
    <script>
      let num = parseInt(prompt("Digite um número:"));
      let i = 1,
        soma = 0;

      do {
        if (i % 2 == 0) {
          soma += i;
        }
        i++;
      } while (i <= num);

      document.write("Soma: " + soma);
    </script>
  </body>
</html>
